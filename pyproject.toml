[project]
name = "factored-hackathon-2026-bianque"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.107",
    "duckdb>=1.5.6",
    "fastapi>=0.142.2",
    "google-genai>=2.28.0",
    "langgraph>=1.2.12",
    "lightgbm>=4.7.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "tqdm>=4.70.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "ipykernel>=7.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
ml = [
    "mlflow>=3.16.1",
    "optuna>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bianque"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",   # PEP 8 style
    "F",        # real errors: unused imports, undefined names
    "I",        # import sorting
    "B",        # common bugs (bugbear)
    "UP",       # modern Python syntax
    "SIM",      # simplifications
    "PTH",      # pathlib over os.path
    "RUF",      # ruff-specific rules
]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
