[project]
name = "factored-hackathon-2026-bianque"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.107",
    "duckdb>=1.5.6",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bianque"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",   # PEP 8 style
    "F",        # real errors: unused imports, undefined names
    "I",        # import sorting
    "B",        # common bugs (bugbear)
    "UP",       # modern Python syntax
    "SIM",      # simplifications
    "PTH",      # pathlib over os.path
    "RUF",      # ruff-specific rules
]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
