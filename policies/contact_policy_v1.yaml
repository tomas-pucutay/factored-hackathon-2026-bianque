# SYNTHETIC POLICY - WRITTEN BY THE TEAM, NOT LEARNED OR MEASURED.
#
# The fraud model only outputs a calibrated probability; this policy decides what to do with
# it: whether to contact the customer proactively, through which channel, and when a human
# must take the case. Every decision records the rules that produced it (bianque.policy).
#
# Thresholds were set from the training-period data and compared on the frozen validation
# set (make evaluate, reports/policy_comparison.md); test is reported, never used to choose.
#
# Versioning: never edit a version that produced published results. Add contact_policy_v2.yaml
# and point configs/settings.yaml to it.

version: contact_policy_v1
cost_assumptions: cost_assumptions_v1  # friction cost of contacting a legitimate customer

# Assumptions behind the thresholds (all SYNTHETIC; evidence in reports/policy_comparison.md):
#   - Friction of alerting a legitimate customer: USD 2 (cost_assumptions_v1). At the scale of
#     a retail bank a false alert is a short "was this you?" message answered with one tap;
#     the comparison checks that the chosen threshold still holds between USD 1.50 and 2.50.
#   - A contacted fraud's loss is fully avoided (the customer blocks the card in time).
#   - A legitimate customer who answers "it's mine" closes the case without a human.
#   - A human case costs one outbound agent call: USD 1.11 (gold.service_cost_baseline,
#     Outbound Call, Transaccional: measured minutes x synthetic cost per minute).

contact:
  # Expected-value rule: contact only if p_fraud x amount_usd > channel cost + friction, so
  # the probability threshold of a charge is (channel cost + friction) / amount: about 1.0
  # for a USD 2 charge, 0.02 for USD 100, 0.0003 for USD 7,000. The floor below sits on top
  # of it. On validation no floor beats the per-charge threshold at any friction between
  # USD 1.50 and 2.50 (reports/policy_comparison.md), so it is 0: the rule alone decides.
  min_p_fraud: 0.0
  # Abstain (human review) when the credible interval of p_fraud straddles the break-even and
  # the stake, (p_high - p_low) x amount, is worth a human review (about one agent call).
  # Near-ties with a small stake are decided automatically: both choices cost about the same.
  abstain_when_interval_straddles: true
  abstain_min_stake_usd: 1.11
  # At most one proactive contact per customer in this window; later flagged charges join
  # the open case instead of triggering another message.
  max_contacts_per_customer_hours: 24

channels:
  # Fraud alerts need an answer within minutes, so only real-time channels are used.
  # Email is too slow; WhatsApp and Voice have no measured response (gold.channel_costs:
  # opens_tracked = false) and an unknown response cannot be ranked.
  allowed: [Push, SMS]
  # Among allowed and eligible channels, the cheapest per message read:
  # cost_per_delivered / open_rate, both from gold.channel_costs.
  rank_by: cost_per_read
  eligibility:
    Push: app_user  # main digital channel is the Android or iOS app
    SMS: always

escalation:
  # The alert itself is always automated. If the customer disputes the charge ("not mine"),
  # the case goes to a human agent (routed by language and specialty) instead of Bianque when
  # any of these holds.
  high_amount_usd: 5000           # about the top 10% of flagged charges
  repeat_complainer_365d: 2       # complaints in the last 365 days (about 1% of customers)
  on_abstain: true                # the model cannot tell (see contact)
  on_tool_failure: true           # a tool failed after its bounded retries
  on_unclear_intent_turns: 2      # the customer's intent is still unclear after 2 turns

actions:
  # What the automated conversation may do, and what each action requires. Enforced by the
  # tools, not by the language model.
  open_dispute:
    requires: [authenticated_session, intent_not_mine]
  provisional_card_block:
    requires: [authenticated_session, intent_not_mine, explicit_confirmation]
  close_as_legitimate:
    requires: [authenticated_session, intent_its_mine]
