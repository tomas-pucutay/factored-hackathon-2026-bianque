table: call_center_interactions
kind: fact
description: Call center interactions with customers (contact center)
primary_key: [interaction_id]
partition_column: process_date
process_day: {timestamp: interaction_date, cutoff: "08:00"}
dedupe_order: [_ingested_at DESC, _source_key DESC]

columns:
  interaction_id: {type: VARCHAR, nullable: false}
  interaction_date: {type: TIMESTAMP, nullable: false}
  process_date: {type: DATE, nullable: false}
  customer_id: {type: VARCHAR, nullable: false}
  agent_id: {type: VARCHAR}
  interaction_type:
    type: VARCHAR
    nullable: false
    allowed: [Chat, Email, Inbound Call, Outbound Call, Video]
  channel: {type: VARCHAR, nullable: false, allowed: [App, Email, Phone, Web, Web Chat, WhatsApp]}
  contact_reason: {type: VARCHAR, nullable: false}
  reason_category:
    type: VARCHAR
    nullable: false
    allowed: [Comercial, Producto, Queja, Retención, Transaccional, Técnico]
  # Asynchronous interactions have no duration. Fully structural: no random NULLs.
  duration_seconds:
    type: INTEGER
    range: [0, null]
    null_when: [{interaction_type: [Chat, Email]}]
  # Queue wait exists only for inbound calls. Fully structural: no random NULLs.
  wait_time_seconds:
    type: INTEGER
    range: [0, null]
    null_when: [{interaction_type: [Chat, Email, Outbound Call, Video]}]
  was_resolved: {type: BOOLEAN}
  requires_followup: {type: BOOLEAN, nullable: false}
  detected_sentiment:
    type: VARCHAR
    allowed: [Muy Negativo, Negativo, Neutral, Positivo, Muy Positivo]
  sentiment_score: {type: "DECIMAL(3,2)", range: [-1, 1]}
  customer_detected_accent: {type: VARCHAR, allowed: [argentine, colombian, mexican, neutral]}
  agent_used_accent: {type: VARCHAR, allowed: [argentine, colombian, mexican, neutral]}
  was_escalated: {type: BOOLEAN, nullable: false}
  # Source: "PRD-A,PRD-B" -> silver: [PRD-A, PRD-B].
  mentioned_products: {type: "VARCHAR[]", split: ","}
  has_transcript: {type: BOOLEAN, nullable: false}
  has_recording: {type: BOOLEAN, nullable: false}

foreign_keys:
  - {column: customer_id, references: customers.customer_id}
  - {column: agent_id, references: service_agents.agent_id}
